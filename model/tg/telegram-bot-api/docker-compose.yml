services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: always
    ports:
      # 对外 31956（与 config/tg-config.yaml 的 base_local 一致），容器内仍是 8081
      - "31956:8081"
    # 凭证放在同目录 .env（不进仓库），这里只引用变量
    env_file:
      - .env
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=0.0.0.0
      - TELEGRAM_MAX_CONNS=1000
      - TELEGRAM_LOG_LEVEL=3
      - TELEGRAM_HTTP=true
      # - HTTP_PROXY=http://127.0.0.1:7890  # 例如：http://192.168.1.100:7890
      # - HTTPS_PROXY=http://127.0.0.1:7890  # 与HTTP_PROXY相同
      # 代理在宿主机上（容器 bridge 网络里 127.0.0.1 指容器自己，必须写宿主机 IP）
      - ALL_PROXY=socks5h://192.168.123.102:7890
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./telegram-bot-api-logs:/var/log/telegram-bot-api
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      # 镜像内没有 curl，用 nc 做端口探测（/getMe 不带 token 必 404，不能作为健康判据）
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  telegram-bot-api-data:
    driver: local
  telegram-bot-api-logs:
    driver: local
    